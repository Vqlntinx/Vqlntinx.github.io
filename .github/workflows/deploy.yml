name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # allows "Run workflow" from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; don't cancel a deploy that's already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 1) build the site and upload it as the Pages artifact
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  # 2) publish it — a separate job, so the artifact is fully registered before deploy looks for it
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
